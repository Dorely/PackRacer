name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build release candidate
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            npm run release:win -- -ExpectedTag $env:GITHUB_REF_NAME
          } else {
            npm run release:win
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PackRacer-Windows-x64-${{ github.sha }}
          path: |
            release/PackRacer-Setup-*-x64.exe
            release/PackRacer-Setup-*-x64.exe.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFiles = Get-ChildItem release -File | Where-Object { $_.Name -like "PackRacer-Setup-*-x64.exe*" } | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $releaseFiles --verify-tag --generate-notes --title "PackRacer $env:GITHUB_REF_NAME"
